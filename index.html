<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="bunny-logo.jpg" type="image/jpeg"><link rel="apple-touch-icon" href="bunny-logo.jpg"><meta name="theme-color" content="#fdf1ea"><meta name="description" content="Cute Bunny — a tiny scrapbook of happy things."><title>Cute Bunny ♡</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div id="welcome" class="welcome"><div class="moon">☾</div><span class="float flower">✿</span><span class="float heart">♡</span><div class="welcome-card"><div class="mascot"><div class="ears"><i></i><i></i></div><div class="bunny-face"><span class="eyes">•　•</span><span class="cheeks">●　●</span><span class="mouth">ᴗ</span></div><span class="mascot-flower">✿</span></div><p class="eyebrow">a little world made just for you</p><h1>Cute Bunny <span>♡</span></h1><p class="intro">A pocketful of photos, favorite songs, and tiny moments worth keeping.</p><button class="primary" id="enter">Open my scrapbook <span>↗</span></button><small>take a breath · stay a little ☁</small></div><div class="ground"></div></div><div id="app" class="app hidden"><header><button class="brand" id="profileOpen"><span id="topMascot">🐰</span> <b>Cute Bunny<small id="topName">little memory garden</small></b></button><span class="crumb">MY SCRAPBOOK <b>/ <span id="crumb">Home</span></b></span><button class="round" id="surprise" title="A little surprise">✧</button></header><main><section id="content"></section></main><nav id="nav"><button class="active" data-page="home"><i>⌂</i><span>Home</span></button><button data-page="gallery"><i>▧</i><span>Photos</span></button><button data-page="music"><i>♫</i><span>Music</span></button><button data-page="notes"><i>✉</i><span>Notes</span></button><button data-page="friends"><i>♡</i><span>Friends</span></button></nav></div><div id="authGate" class="auth-gate hidden"><form id="authForm" class="auth-card"><button type="button" class="auth-close" id="authClose">×</button><div class="auth-bunny">🐰</div><p class="eyebrow">YOUR LITTLE WORLD</p><h2 id="authTitle">Create your account</h2><p class="auth-hint">Make a private space to share with your friend.</p><label>Email<input id="authEmail" type="email" maxlength="254" autocomplete="email" placeholder="you@example.com" required></label><label>Display name<input id="authDisplay" maxlength="60" placeholder="What should we call you?"></label><label>Username<input id="authUser" maxlength="24" autocomplete="username" placeholder="3–24 letters, numbers or _"></label><label>Password<input id="authPass" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><button class="primary auth-submit" id="authSubmit">Create account ♡</button><p class="auth-error" id="authError"></p><button type="button" class="auth-switch" id="authSwitch">Already have an account? Sign in</button></form></div><div id="profileGate" class="auth-gate hidden"><div class="auth-card profile-card"><button type="button" class="auth-close" id="profileClose">×</button><div class="auth-bunny">🐰</div><h2 id="profileName">Your profile</h2><p id="profileHandle" class="auth-hint"></p><label>Display name<input id="profileDisplay" maxlength="60"></label><label>About you<input id="profileBio" maxlength="300" placeholder="A little hello..."></label><label>Your colors<select id="profileTheme"><option value="rose">Rose garden 🌷</option><option value="lavender">Lavender skies ☁</option><option value="mint">Mint meadow 🍃</option><option value="sky">Bluebird day 🐦</option></select></label><label>Your little buddy<select id="profileMascot"><option value="🐰">Bunny 🐰</option><option value="🐱">Kitty 🐱</option><option value="🐻">Bear 🐻</option><option value="🐸">Frog 🐸</option></select></label><button class="primary auth-submit" id="profileSave">Save profile ♡</button><button class="auth-switch" id="signOut">Sign out</button></div></div><input id="picker" type="file" accept="image/*,audio/*" multiple hidden><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script></body></html>
