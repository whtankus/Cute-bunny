name: Publish Cute Bunny Android polish preview

on:
  push:
    branches:
      - fix/android-safe-area-adaptive-launcher
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cute-bunny-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build preview with the existing Supabase project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm run check
          npm run build

      - name: Upload preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy preview site
        id: deployment
        uses: actions/deploy-pages@v4
