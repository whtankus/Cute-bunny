name: Cute Bunny Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cute-bunny-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source checks and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and resolve lockfile
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run source smoke tests
        run: npm test

      - name: Commit generated dependency lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Dependency lockfile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add npm dependency lockfile"
          git push
