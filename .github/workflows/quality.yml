name: Cute Bunny Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cute-bunny-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source checks and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run source smoke tests
        run: npm test
