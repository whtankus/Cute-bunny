name: Cute Bunny Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cute-bunny-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source checks and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and resolve lockfile
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run source smoke tests
        run: npm test

      - name: Preserve generated dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cute-bunny-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
