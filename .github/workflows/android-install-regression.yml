name: Cute Bunny Android Install Regression

on:
  pull_request:
    types: [ready_for_review, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-install:
    name: Build and install Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install locked dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Generate Android platform
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Install and launch APK in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.cutebunny.app || true
            adb shell monkey -p com.cutebunny.app 1
            sleep 15
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity'

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cute-bunny-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
