name: Build Cute Bunny Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "style.css"
      - "polish.css"
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "supabase-config.js"
      - "bunny-app-icon-192.png"
      - "bunny-app-icon-512.png"
      - "scripts/build-preview.js"
      - "scripts/configure-android-signing.js"
      - "scripts/android-updater-entry.js"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: write

concurrency:
  group: cute-bunny-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out Cute Bunny
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build bundled web app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run check

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply the website logo as the Android launcher icon
        run: |
          npm install --no-save --no-audit --no-fund sharp
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { mkdir, rm } from 'node:fs/promises';
          const source = 'dist/bunny-app-icon-512.png';
          const root = 'android/app/src/main/res';
          const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          for (const [density, size] of Object.entries(sizes)) {
            const dir = `${root}/mipmap-${density}`;
            await mkdir(dir, { recursive: true });
            await sharp(source).resize(size, size, { fit: 'contain' }).png().toFile(`${dir}/ic_launcher.png`);
            await sharp(source).resize(size, size, { fit: 'contain' }).png().toFile(`${dir}/ic_launcher_round.png`);
          }
          await rm(`${root}/mipmap-anydpi-v26`, { recursive: true, force: true });
          NODE

      - name: Prepare Capgo-compatible OTA bundle (offline CLI mode)
        env:
          OTA_VERSION: 1.0.${{ github.run_number }}
        run: |
          set -euo pipefail
          # The CLI zip command is local-only: it formats the bundle and
          # computes its checksum without logging in to or uploading to Capgo.
          npx --yes @capgo/cli@latest bundle zip com.cutebunny.app \
            --path ./dist -b "$OTA_VERSION" -n cute-bunny-ota.zip -j > bundle-info.json
          cat bundle-info.json
          test -s cute-bunny-ota.zip
          OTA_CHECKSUM="$(jq -er '.checksum' bundle-info.json)"
          echo "OTA_VERSION=$OTA_VERSION" >> "$GITHUB_ENV"
          echo "OTA_CHECKSUM=$OTA_CHECKSUM" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: cute-bunny-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish free OTA bundle and refresh update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          OTA_VERSION: ${{ env.OTA_VERSION }}
          OTA_CHECKSUM: ${{ env.OTA_CHECKSUM }}
        run: |
          set -euo pipefail
          TAG="ota-v${OTA_VERSION}"
          gh release create "$TAG" cute-bunny-ota.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cute Bunny OTA $OTA_VERSION" \
            --notes "Web-only OTA bundle for Cute Bunny. SHA-256: $OTA_CHECKSUM"

          DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/cute-bunny-ota.zip"
          jq -n \
            --arg appId "com.cutebunny.app" \
            --arg version "$OTA_VERSION" \
            --arg url "$DOWNLOAD_URL" \
            --arg checksum "$OTA_CHECKSUM" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{appId:$appId,version:$version,url:$url,checksum:$checksum,publishedAt:$publishedAt}' > ota-latest.json

          MANIFEST_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/ota/latest.json" --jq .sha)"
          MANIFEST_CONTENT="$(base64 -w 0 ota-latest.json)"
          gh api "repos/$GITHUB_REPOSITORY/contents/ota/latest.json" \
            -X PUT \
            -f message="Publish Cute Bunny OTA $OTA_VERSION" \
            -f content="$MANIFEST_CONTENT" \
            -f sha="$MANIFEST_SHA" \
            -f branch="main"

      - name: Prepare persistent Android release keystore
        id: release-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore_b64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"
          store_password="$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          key_alias="$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '[:space:]')"
          key_password="$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')"

          if [ -z "$keystore_b64" ] || [ -z "$store_password" ] || [ -z "$key_alias" ] || [ -z "$key_password" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release APK publishing is skipped until all four Android signing secrets are configured."
            exit 0
          fi

          if ! [[ "$keystore_b64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] || [ $(( ${#keystore_b64} % 4 )) -ne 0 ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi

          printf '%s' "$keystore_b64" | base64 --decode > android/app/release-key.keystore
          chmod 600 android/app/release-key.keystore
          keytool -list -keystore android/app/release-key.keystore -storetype PKCS12 -storepass "$store_password" -alias "$key_alias"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build signed Android release APK
        if: steps.release-signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-key.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          node scripts/configure-android-signing.js
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload signed Android release APK
        if: steps.release-signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cute-bunny-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish signed APK as a GitHub Release asset for Orion Store
        if: steps.release-signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          TAG="v${ANDROID_VERSION_NAME}"
          cp android/app/build/outputs/apk/release/app-release.apk Cute-Bunny.apk
          gh release create "$TAG" Cute-Bunny.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cute Bunny $TAG" \
            --notes "Signed Android installation package for Cute Bunny. Android version code: ${GITHUB_RUN_NUMBER}.";
