name: Build Cute Bunny Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "style.css"
      - "index.html"
      - "bunny-app-icon-192.png"
      - "bunny-app-icon-512.png"
      - "scripts/build-preview.js"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out Cute Bunny
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build bundled web app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run check

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply the website logo as the Android launcher icon
        run: |
          npm install --no-save --no-audit --no-fund sharp
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { mkdir, rm } from 'node:fs/promises';
          const source = 'dist/bunny-app-icon-512.png';
          const root = 'android/app/src/main/res';
          const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          for (const [density, size] of Object.entries(sizes)) {
            const dir = `${root}/mipmap-${density}`;
            await mkdir(dir, { recursive: true });
            await sharp(source).resize(size, size, { fit: 'contain' }).png().toFile(`${dir}/ic_launcher.png`);
            await sharp(source).resize(size, size, { fit: 'contain' }).png().toFile(`${dir}/ic_launcher_round.png`);
          }
          // Remove Capacitor's generated adaptive icon so Android uses the
          // exact same full-square artwork as the website favicon/app icon.
          await rm(`${root}/mipmap-anydpi-v26`, { recursive: true, force: true });
          NODE

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: cute-bunny-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
