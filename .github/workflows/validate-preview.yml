name: Validate Cute Bunny preview branch

on:
  push:
    branches: [perfect-2]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check preview build configuration
        run: |
          test -f vercel.json
          test -f scripts/build-preview.js
