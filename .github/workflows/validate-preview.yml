name: Validate Cute Bunny preview branch

on:
  push:
    branches: [perfect-2]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test preview build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: preview-build-test-key
        run: |
          npm run build
          test -s dist/index.html
          test -s dist/supabase-config.js
          test -s dist/app.js

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build web assets and add Capacitor Android
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: preview-build-test-key
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build
          npx cap add android
          npx cap sync android
      - name: Configure native status bar and adaptive launcher icon
        run: |
          npm install --no-save --no-audit --no-fund sharp
          node scripts/configure-android-native.js
      - name: Compile Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
