name: Validate Cute Bunny preview branch

on:
  push:
    branches: [perfect-2]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test preview build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: preview-build-test-key
        run: |
          npm run build
          test -s dist/index.html
          test -s dist/supabase-config.js
          test -s dist/app.js
