<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">A quiet blossom garden at sunset</title>
  <desc id="desc">Layered lavender mountains, a warm peach sunset, flowering cherry branches and a meadow of pink, cream and lilac flowers.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f6dce9"/>
      <stop offset=".58" stop-color="#f7e6e7"/>
      <stop offset="1" stop-color="#e9e5f1"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop stop-color="#fff8df" stop-opacity=".98"/>
      <stop offset=".72" stop-color="#ffe8c9" stop-opacity=".66"/>
      <stop offset="1" stop-color="#ffe8c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farHill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c9b9d8"/><stop offset="1" stop-color="#a99bbb"/>
    </linearGradient>
    <linearGradient id="midHill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b8b2d1"/><stop offset="1" stop-color="#8e9bb5"/>
    </linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a9b99d"/><stop offset="1" stop-color="#6f927c"/>
    </linearGradient>
    <linearGradient id="petalPink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff1f4"/><stop offset="1" stop-color="#e69bb8"/>
    </linearGradient>
    <linearGradient id="petalLilac" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7ecfb"/><stop offset="1" stop-color="#baa6d4"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <g id="blossom">
      <g fill="url(#petalPink)" stroke="#d88eaa" stroke-opacity=".45" stroke-width="1.5">
        <ellipse cy="-15" rx="8" ry="15"/>
        <ellipse cy="-15" rx="8" ry="15" transform="rotate(72)"/>
        <ellipse cy="-15" rx="8" ry="15" transform="rotate(144)"/>
        <ellipse cy="-15" rx="8" ry="15" transform="rotate(216)"/>
        <ellipse cy="-15" rx="8" ry="15" transform="rotate(288)"/>
      </g>
      <circle r="6" fill="#f3c875"/>
      <circle r="2" fill="#fff5d8"/>
    </g>
    <g id="smallBloom">
      <g fill="url(#petalLilac)">
        <ellipse cy="-10" rx="5.5" ry="10"/>
        <ellipse cy="-10" rx="5.5" ry="10" transform="rotate(60)"/>
        <ellipse cy="-10" rx="5.5" ry="10" transform="rotate(120)"/>
        <ellipse cy="-10" rx="5.5" ry="10" transform="rotate(180)"/>
        <ellipse cy="-10" rx="5.5" ry="10" transform="rotate(240)"/>
        <ellipse cy="-10" rx="5.5" ry="10" transform="rotate(300)"/>
      </g><circle r="4.5" fill="#f5d17c"/>
    </g>
  </defs>

  <rect width="880" height="520" fill="url(#sky)"/>
  <circle cx="640" cy="185" r="165" fill="url(#sun)"/>
  <circle cx="640" cy="185" r="46" fill="#fff1d1" opacity=".78"/>
  <path d="M0 260 Q110 193 225 240 T450 230 T690 215 T880 244 V520 H0Z" fill="#e6dced" opacity=".55"/>
  <path d="M0 310 L110 220 195 276 295 194 415 292 535 214 650 283 758 207 880 290 V520 H0Z" fill="url(#farHill)" opacity=".9"/>
  <path d="M0 337 Q120 268 236 321 T470 305 T695 314 T880 292 V520 H0Z" fill="url(#midHill)" opacity=".94"/>
  <path d="M0 380 Q128 327 260 367 T510 354 T735 354 T880 340 V520 H0Z" fill="#9cabaf" opacity=".78"/>
  <path d="M0 418 Q120 356 245 395 T480 387 T700 383 T880 375 V520 H0Z" fill="url(#meadow)"/>
  <path d="M0 454 Q160 415 300 442 T560 438 T880 412 V520 H0Z" fill="#78947a" opacity=".78"/>

  <!-- Distant flower terraces -->
  <g opacity=".54" fill="#f8e6ef">
    <circle cx="105" cy="366" r="5"/><circle cx="145" cy="351" r="4"/><circle cx="218" cy="374" r="5"/>
    <circle cx="332" cy="348" r="4"/><circle cx="412" cy="367" r="5"/><circle cx="535" cy="343" r="4"/>
    <circle cx="720" cy="366" r="5"/><circle cx="792" cy="348" r="4"/>
  </g>

  <!-- Cherry branch entering from the upper left -->
  <path d="M-42 80 C95 60 132 105 216 125 S355 135 435 76" fill="none" stroke="#765a62" stroke-width="17" stroke-linecap="round"/>
  <path d="M84 88 C124 34 157 13 210 -5 M194 120 C224 68 269 42 316 25 M300 135 C338 103 372 94 425 90"
        fill="none" stroke="#806169" stroke-width="7" stroke-linecap="round"/>
  <g fill="#8eaa82">
    <ellipse cx="80" cy="65" rx="18" ry="7" transform="rotate(-34 80 65)"/>
    <ellipse cx="135" cy="45" rx="20" ry="8" transform="rotate(-48 135 45)"/>
    <ellipse cx="180" cy="94" rx="22" ry="8" transform="rotate(22 180 94)"/>
    <ellipse cx="255" cy="73" rx="22" ry="8" transform="rotate(-22 255 73)"/>
    <ellipse cx="333" cy="112" rx="21" ry="8" transform="rotate(15 333 112)"/>
    <ellipse cx="390" cy="79" rx="19" ry="7" transform="rotate(-22 390 79)"/>
  </g>
  <g>
    <use href="#blossom" transform="translate(46 78) scale(1.1)"/>
    <use href="#blossom" transform="translate(118 39) scale(.88)"/>
    <use href="#blossom" transform="translate(165 122) scale(1.05)"/>
    <use href="#blossom" transform="translate(235 57) scale(.9)"/>
    <use href="#blossom" transform="translate(292 107) scale(1.08)"/>
    <use href="#blossom" transform="translate(366 84) scale(.8)"/>
    <use href="#smallBloom" transform="translate(78 132) scale(.82)"/>
    <use href="#smallBloom" transform="translate(207 20) scale(.76)"/>
  </g>

  <!-- Flowering shrubs at the edges -->
  <g stroke="#62866b" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M35 520 Q49 445 70 385 M98 520 Q102 456 135 410 M810 520 Q786 454 795 386 M865 520 Q833 452 848 405"/>
    <path d="M740 520 Q720 455 740 418 M175 520 Q178 468 207 432"/>
  </g>
  <g fill="#9db991">
    <path d="M68 447 Q23 405 17 434 Q37 469 68 447Z"/><path d="M69 422 Q95 380 111 404 Q97 435 69 422Z"/>
    <path d="M132 467 Q90 428 83 457 Q104 485 132 467Z"/><path d="M798 452 Q758 412 752 440 Q772 471 798 452Z"/>
    <path d="M797 427 Q828 387 844 414 Q829 440 797 427Z"/><path d="M846 476 Q815 442 807 466 Q823 492 846 476Z"/>
    <path d="M739 468 Q706 432 698 456 Q715 485 739 468Z"/><path d="M207 473 Q175 438 166 461 Q181 489 207 473Z"/>
  </g>
  <g>
    <use href="#blossom" transform="translate(45 390) scale(.9)"/>
    <use href="#smallBloom" transform="translate(103 420) scale(.76)"/>
    <use href="#blossom" transform="translate(154 457) scale(.76)"/>
    <use href="#smallBloom" transform="translate(210 440) scale(.72)"/>
    <use href="#blossom" transform="translate(742 422) scale(.82)"/>
    <use href="#blossom" transform="translate(803 388) scale(1.05)"/>
    <use href="#smallBloom" transform="translate(850 446) scale(.8)"/>
    <use href="#blossom" transform="translate(690 468) scale(.76)"/>
  </g>

  <!-- Meadow flowers -->
  <g stroke="#65866a" stroke-width="3" stroke-linecap="round">
    <path d="M280 520 Q283 474 291 434 M340 520 Q333 475 351 450 M440 520 Q438 464 455 420 M540 520 Q533 478 551 447 M620 520 Q627 465 641 430" fill="none"/>
  </g>
  <g fill="#a9c19b">
    <path d="M286 486 Q258 461 251 480 Q264 500 286 486Z"/><path d="M294 476 Q314 450 324 468 Q313 489 294 476Z"/>
    <path d="M347 493 Q322 470 315 491 Q330 507 347 493Z"/><path d="M548 491 Q519 470 513 491 Q530 510 548 491Z"/>
    <path d="M638 484 Q610 462 604 482 Q621 501 638 484Z"/>
  </g>
  <g>
    <use href="#blossom" transform="translate(291 431) scale(.86)"/>
    <use href="#smallBloom" transform="translate(351 447) scale(.92)"/>
    <use href="#blossom" transform="translate(455 417) scale(1.08)"/>
    <use href="#smallBloom" transform="translate(551 444) scale(.8)"/>
    <use href="#blossom" transform="translate(641 425) scale(.88)"/>
  </g>

  <!-- Falling petals -->
  <g fill="#fff0f4" stroke="#dc9eb6" stroke-opacity=".45" stroke-width="1.2">
    <path d="M485 133 q18-15 22 4 q-13 13-22-4Z" transform="rotate(25 496 136)"/>
    <path d="M570 275 q17-13 20 5 q-14 11-20-5Z" transform="rotate(-28 580 278)"/>
    <path d="M390 236 q14-12 18 4 q-10 12-18-4Z" transform="rotate(35 400 238)"/>
    <path d="M755 300 q15-12 18 5 q-12 10-18-5Z" transform="rotate(18 766 303)"/>
    <path d="M228 280 q14-11 17 5 q-11 10-17-5Z" transform="rotate(-18 238 282)"/>
  </g>
  <g fill="#fff8ef" opacity=".78">
    <circle cx="492" cy="62" r="3"/><circle cx="573" cy="110" r="2.5"/><circle cx="700" cy="90" r="2"/>
    <circle cx="420" cy="315" r="2.5"/><circle cx="605" cy="340" r="2"/>
  </g>
  <rect x="1.5" y="1.5" width="877" height="517" rx="34" fill="none" stroke="#fff8f4" stroke-opacity=".45" stroke-width="3"/>
</svg>